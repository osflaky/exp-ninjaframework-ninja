name: Java 8
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, 
            macos-15-intel]
      fail-fast: false
      max-parallel: 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - name: Set up Azul JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: 8
        distribution: 'zulu'
        cache: 'maven'
    - name: Test in Maven
      run: mvn test
