name: Java 8
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - name: Set up Azul JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: 8
        distribution: 'zulu'
        cache: 'maven'
    - name: Test in Maven
      run: mvn test
